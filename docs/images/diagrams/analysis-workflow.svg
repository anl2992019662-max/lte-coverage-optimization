<text x="65" y="883" font-family="Microsoft YaHei, Noto Sans SC, Arial, sans-serif" font-size="16" fill="#425f73" font-weight="400" text-anchor="start">截图保留原 PPT 的前后标记与数值；它们不是本仓库新增的复现结果。</text>
<text x="65" y="908" font-family="Microsoft YaHei, Noto Sans SC, Arial, sans-serif" font-size="16" fill="#425f73" font-weight="400" text-anchor="start">已知两个不同案例标记的 UOD 字节相同，数据配对待核实，详见 docs/VALIDATION.md。</text>
